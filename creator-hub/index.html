<title>StreamHub — creator link page</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ============================================================
     STREAMHUB  ·  one-file creator link page
     Customize everything in the CONFIG block near the bottom.
     No build step, no dependencies, works offline. Drop this
     index.html on any free host (GitHub Pages, Netlify, Vercel).
     ============================================================ */
  :root {
    --accent: #7c5cff;            /* overridden by CONFIG.theme.accent */
    --accent-2: #ff5ca8;
    --bg: #f4f4f8;
    --surface: #ffffff;
    --surface-2: #f0f0f6;
    --ink: #16151d;
    --muted: #6b6980;
    --line: #e4e3ee;
    --live: #ff3b57;
    --radius: 16px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="dark"], :root:not([data-theme="light"]) {}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0b12; --surface: #16151f; --surface-2: #1e1d2b;
      --ink: #f0eefb; --muted: #a09db8; --line: #2a2838;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0b12; --surface: #16151f; --surface-2: #1e1d2b;
    --ink: #f0eefb; --muted: #a09db8; --line: #2a2838;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    min-height: 100vh; line-height: 1.5;
    background-image: radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 64px; }

  .topbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .theme-btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .theme-btn:hover { color: var(--ink); }

  .hero { text-align: center; padding: 8px 0 22px; }
  .avatar {
    width: 104px; height: 104px; border-radius: 50%; margin: 0 auto 16px;
    display: grid; place-items: center; font-size: 40px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 35%, transparent);
    position: relative;
  }
  .avatar .ring { position: absolute; inset: -5px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); }
  .live-pill {
    display: none; align-items: center; gap: 6px; margin: 0 auto 12px; width: fit-content;
    background: color-mix(in srgb, var(--live) 15%, transparent); color: var(--live);
    border: 1px solid color-mix(in srgb, var(--live) 40%, transparent);
    padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; letter-spacing: .03em;
  }
  .live-pill.on { display: flex; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.7); } }
  h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.02em; }
  .handle { color: var(--accent); font-weight: 600; font-size: 15px; margin-top: 2px; }
  .tagline { color: var(--muted); font-size: 15px; margin-top: 10px; }

  .links { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; }
  .link {
    display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 15px 18px; font-weight: 650; font-size: 15.5px;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .link:hover { transform: translateY(-2px); border-color: var(--accent);
    box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 18%, transparent); }
  .link .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    background: var(--surface-2); font-size: 18px; flex-shrink: 0; }
  .link .txt { flex: 1; }
  .link .sub { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; margin-top: 1px; }
  .link .arrow { color: var(--muted); font-size: 18px; }
  .link.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; }
  .link.primary .ico { background: rgba(255,255,255,.18); }
  .link.primary .sub, .link.primary .arrow { color: rgba(255,255,255,.85); }

  .section-title { font-size: 12.5px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); font-weight: 700; margin: 32px 4px 12px; }

  .schedule { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { text-align: center; background: var(--surface); border: 1px solid var(--line);
    border-radius: 11px; padding: 9px 4px; }
  .day .d { font-size: 11px; color: var(--muted); font-weight: 600; }
  .day .t { font-size: 11.5px; font-weight: 700; margin-top: 3px; }
  .day.live-day { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .day.off .t { color: var(--muted); font-weight: 500; }

  .gear { display: flex; flex-direction: column; gap: 10px; }
  .gear-item { display: flex; align-items: center; gap: 13px; text-decoration: none; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 12px 15px; }
  .gear-item:hover { border-color: var(--accent); }
  .gear-item .ico { font-size: 20px; }
  .gear-item .g-name { font-weight: 650; font-size: 14.5px; }
  .gear-item .g-cat { color: var(--muted); font-size: 12px; }
  .gear-item .g-cta { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--accent); }

  footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 40px; }
  footer a { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <div class="topbar"><button class="theme-btn" id="themeBtn" aria-label="Toggle theme">◑ theme</button></div>

  <div class="hero">
    <div class="avatar"><span class="ring"></span><span id="avatarInit">?</span></div>
    <div class="live-pill" id="livePill"><span class="live-dot"></span> LIVE NOW</div>
    <h1 id="name">Name</h1>
    <div class="handle" id="handle">@handle</div>
    <p class="tagline" id="tagline"></p>
  </div>

  <div class="links" id="links"></div>

  <div id="scheduleWrap" hidden>
    <div class="section-title">Stream schedule</div>
    <div class="schedule" id="schedule"></div>
  </div>

  <div id="gearWrap" hidden>
    <div class="section-title" id="gearTitle">My setup</div>
    <div class="gear" id="gear"></div>
  </div>

  <footer><span id="footerText"></span></footer>
</div>

<script>
/* ============================================================
   CONFIG — edit ONLY this block to make the page yours.
   Everything above renders from these values.
   ============================================================ */
const CONFIG = {
  name: "Nova",
  handle: "@novaplays",
  tagline: "Variety streamer · ranked grinder · cozy nights 🎮",
  avatarInitials: "NV",          // shows if you don't use a photo
  isLive: true,                  // flip to show/hide the LIVE badge
  theme: { accent: "#7c5cff", accent2: "#ff5ca8" },  // your brand colors

  // Buttons in order. Mark ONE as primary:true for the big highlighted CTA.
  links: [
    { icon: "🟣", label: "Watch on Twitch", sub: "Live 5 nights a week", url: "https://twitch.tv/", primary: true },
    { icon: "▶️", label: "YouTube", sub: "VODs & highlights", url: "https://youtube.com/" },
    { icon: "💬", label: "Join the Discord", sub: "3,200 members", url: "https://discord.gg/" },
    { icon: "🎵", label: "TikTok", sub: "Daily clips", url: "https://tiktok.com/" },
    { icon: "𝕏", label: "Twitter / X", sub: "@novaplays", url: "https://x.com/" },
    { icon: "☕", label: "Support the stream", sub: "Tips & donations", url: "https://ko-fi.com/" },
  ],

  // Weekly schedule. Use "" for an off day.
  schedule: [
    { d: "Mon", t: "7pm" }, { d: "Tue", t: "7pm" }, { d: "Wed", t: "" },
    { d: "Thu", t: "7pm" }, { d: "Fri", t: "8pm" }, { d: "Sat", t: "2pm" }, { d: "Sun", t: "" },
  ],
  liveDayIndex: 4,  // highlight today (0=Mon). Set to -1 for none.

  // Your gear — use YOUR affiliate links here; this is how the page earns.
  gearTitle: "My setup (affiliate)",
  gear: [
    { icon: "🎧", name: "HyperX Cloud II", cat: "Headset", url: "#" },
    { icon: "⌨️", name: "Keychron K2", cat: "Keyboard", url: "#" },
    { icon: "🖱️", name: "Logitech G Pro X", cat: "Mouse", url: "#" },
    { icon: "🎙️", name: "Shure MV7", cat: "Microphone", url: "#" },
  ],

  footer: "Made with StreamHub",
};

/* ---------- renderer (you shouldn't need to touch this) ---------- */
(function render(c) {
  const $ = (id) => document.getElementById(id);
  // Escape config values before they hit innerHTML, and only allow link
  // schemes that can't run script — so a pasted config can't inject code.
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (ch) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const safeUrl = (u) => /^(https?:|mailto:|#)/i.test(String(u ?? '').trim()) ? esc(String(u).trim()) : '#';
  const safeColor = (v) => /^[#a-zA-Z0-9(),.%\s-]{1,40}$/.test(String(v ?? '')) ? v : null;
  const r = document.documentElement;
  if (safeColor(c.theme?.accent)) r.style.setProperty('--accent', c.theme.accent);
  if (safeColor(c.theme?.accent2)) r.style.setProperty('--accent-2', c.theme.accent2);

  $('avatarInit').textContent = c.avatarInitials || (c.name?.[0] ?? '?');
  $('name').textContent = c.name || '';
  $('handle').textContent = c.handle || '';
  $('tagline').textContent = c.tagline || '';
  document.title = (c.name ? c.name + ' — ' : '') + 'links';
  if (c.isLive) $('livePill').classList.add('on');

  $('links').innerHTML = (c.links || []).map((l) => `
    <a class="link${l.primary ? ' primary' : ''}" href="${safeUrl(l.url)}" target="_blank" rel="noopener">
      <span class="ico">${esc(l.icon) || '🔗'}</span>
      <span class="txt">${esc(l.label)}${l.sub ? `<span class="sub">${esc(l.sub)}</span>` : ''}</span>
      <span class="arrow">→</span>
    </a>`).join('');

  if (c.schedule?.length) {
    $('scheduleWrap').hidden = false;
    $('schedule').innerHTML = c.schedule.map((s, i) => `
      <div class="day${!s.t ? ' off' : ''}${i === c.liveDayIndex ? ' live-day' : ''}">
        <div class="d">${esc(s.d)}</div><div class="t">${esc(s.t) || '—'}</div>
      </div>`).join('');
  }

  if (c.gear?.length) {
    $('gearWrap').hidden = false;
    $('gearTitle').textContent = c.gearTitle || 'My setup';
    $('gear').innerHTML = c.gear.map((g) => `
      <a class="gear-item" href="${safeUrl(g.url)}" target="_blank" rel="noopener">
        <span class="ico">${esc(g.icon) || '📦'}</span>
        <span><div class="g-name">${esc(g.name)}</div><div class="g-cat">${esc(g.cat) || ''}</div></span>
        <span class="g-cta">View →</span>
      </a>`).join('');
  }

  $('footerText').textContent = c.footer || '';

  // theme toggle (remembers choice)
  const saved = localStorage.getItem('sh-theme');
  if (saved) r.setAttribute('data-theme', saved);
  $('themeBtn').addEventListener('click', () => {
    const cur = r.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    r.setAttribute('data-theme', next);
    localStorage.setItem('sh-theme', next);
  });
})(CONFIG);
</script>
